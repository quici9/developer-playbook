# Tham số cho ~/.claude/skills/product-team/scripts/gate.sh (bash syntax). Đường dẫn tương đối tính từ gốc worktree.
FRONTEND_DIR=frontend
BUILD_CMD="npm run build"
CHECK_CMD=""                        # vd. "npm test --silent"; để trống nếu chưa có
BACKEND_TEST_CMD=""                 # vd. "docker compose -p \$PROJ -f docker-compose.test.yml run --rm test"; \$PROJ do gate.sh đặt
DIST_DIR=frontend/dist
DIST_PROBE='__fixtures__|devMock'   # regex: code mock không được lọt vào bản build
SRC_GLOB=frontend/src
SRC_EXCLUDE='__fixtures__|\.check\.ts|\.test\.'
BANNED=''                           # regex từ cấm trong chuỗi UI, vd. 'tạm tính|ước tính|(phút|giờ|ngày) trước'
ALLOWLIST_FILE=.claude/team/allowlist.tsv   # mỗi dòng: <file>\t<chuỗi chính xác được phép>
DEV_URL=http://localhost:5173
WIDTHS=1280,1920,2560
THEMES=dark,light
THEME_STORAGE='theme'               # khoá localStorage để ép theme; để trống nếu không có
PAGES_FILE=.claude/team/pages.txt
EXTRA_QUERY=''                      # vd. 'fixture=demo' nếu dev server bật mock/đăng nhập giả qua query
